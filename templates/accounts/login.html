<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #1a2035 0%, #1d3461 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; max-width: 440px; width: 100%; }
        .login-header { background: linear-gradient(135deg, {{ hospital.primary_color }} 0%, {{ hospital.secondary_color }} 100%); padding: 2.5rem; text-align: center; color: white; }
        .login-header img { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; margin-bottom: 1rem; border: 3px solid rgba(255,255,255,0.3); }
        .login-header h4 { font-weight: 700; margin: 0; font-size: 1.3rem; }
        .login-header p { opacity: 0.85; margin: 0; font-size: 0.85rem; }
        .login-body { padding: 2rem; }
        .form-control { border-radius: 10px; border: 1.5px solid #e9ecef; padding: 0.65rem 1rem; }
        .form-control:focus { border-color: {{ hospital.primary_color }}; box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15); }
        .btn-login { background: {{ hospital.primary_color }}; border: none; border-radius: 10px; padding: 0.7rem; font-weight: 600; width: 100%; }
        .btn-login:hover { opacity: 0.9; }
        .input-group-text { border-radius: 10px 0 0 10px; background: #f8f9fa; border: 1.5px solid #e9ecef; border-right: none; }
        .input-group .form-control { border-left: none; border-radius: 0 10px 10px 0; }
        .hospital-info { background: #f8f9fa; padding: 1rem; border-top: 1px solid #eee; text-align: center; font-size: 0.8rem; color: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center">
        <div class="login-card">
            <div class="login-header">
                {% if hospital.logo %}
                    <img src="{{ hospital.logo.url }}" alt="Logo">
                {% else %}
                    <div style="width:70px;height:70px;background:rgba(255,255,255,0.2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;">🏥</div>
                {% endif %}
                <h4>{{ hospital.name }}</h4>
                <p>Hospital Management System</p>
            </div>
            <div class="login-body">
                {% for message in messages %}
                <div class="alert alert-danger alert-sm mb-3 py-2">{{ message }}</div>
                {% endfor %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login btn-primary text-white">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>
            </div>
            <div class="hospital-info">
                <i class="fas fa-map-marker-alt me-1"></i>{{ hospital.address|truncatechars:60 }}
                <br><i class="fas fa-phone me-1"></i>{{ hospital.phone }}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
