{% extends 'base.html' %}
{% block title %}{{ action }} User{% endblock %}
{% block page_title %}{{ action }} User{% endblock %}
{% block content %}
<div class="row"><div class="col-md-6">
<div class="card">
<div class="card-header py-3 px-4"><i class="fas fa-user-plus me-2 text-primary"></i>{{ action }} User</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="row g-3">
{% if action == 'Create' %}
<div class="col-md-6"><label class="form-label fw-semibold">Username *</label><input type="text" name="username" class="form-control" required></div>
<div class="col-md-6"><label class="form-label fw-semibold">Password *</label><input type="password" name="password" class="form-control" required></div>
{% endif %}
<div class="col-md-6"><label class="form-label fw-semibold">First Name</label><input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name }}"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Last Name</label><input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name }}"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control" value="{{ edit_user.email }}"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input type="text" name="phone" class="form-control" value="{{ edit_user.phone }}"></div>
<div class="col-md-6"><label class="form-label fw-semibold">Role *</label>
<select name="role" class="form-select" required>
{% for val, label in roles %}<option value="{{ val }}" {% if edit_user.role == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
</select></div>
{% if action == 'Edit' %}
<div class="col-md-6"><label class="form-label fw-semibold">New Password (leave blank to keep)</label><input type="password" name="new_password" class="form-control"></div>
<div class="col-12">
<div class="form-check"><input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if edit_user.is_active %}checked{% endif %}><label class="form-check-label fw-semibold" for="is_active">Active</label></div>
</div>
{% endif %}
<div class="col-12">
<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>{{ action }} User</button>
<a href="{% url 'user_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</div>
</div>
</form>
</div>
</div>
</div></div>
{% endblock %}
