{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="row"><div class="col-md-5">
<div class="card">
<div class="card-header py-3 px-4"><i class="fas fa-lock me-2"></i>Change Password</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label fw-semibold">Current Password</label><input type="password" name="old_password" class="form-control" required></div>
<div class="mb-3"><label class="form-label fw-semibold">New Password</label><input type="password" name="new_password" class="form-control" required></div>
<div class="mb-3"><label class="form-label fw-semibold">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
<button type="submit" class="btn btn-primary w-100">Change Password</button>
</form>
</div>
</div>
</div></div>
{% endblock %}
