{% extends 'base.html' %}
{% block title %}Admit Patient{% endblock %}
{% block page_title %}Patient Admission{% endblock %}
{% block content %}
<div class="card">
<div class="card-header py-3 px-4"><i class="fas fa-user-check me-2 text-primary"></i>Admit Patient to IPD</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="row g-3 mb-4">
<div class="col-md-6"><label class="form-label fw-semibold">Patient *</label>
<select name="patient" class="form-select" required>
<option value="">-- Select Patient --</option>
{% for p in patients %}<option value="{{ p.pk }}">{{ p.get_full_name }} ({{ p.patient_id }})</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Admitting Doctor *</label>
<select name="admitting_doctor" class="form-select" required>
<option value="">-- Select Doctor --</option>
{% for d in doctors %}<option value="{{ d.pk }}">Dr. {{ d.user.get_full_name }} – {{ d.specialization }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Department</label>
<select name="department" class="form-select">
<option value="">-- Select --</option>
{% for dept in departments %}<option value="{{ dept.pk }}">{{ dept.name }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Attending Nurse</label>
<select name="attending_nurse" class="form-select">
<option value="">-- Optional --</option>
{% for n in nurses %}<option value="{{ n.pk }}">{{ n.get_full_name }}</option>{% endfor %}
</select></div>
</div>
<h6 class="fw-bold border-bottom pb-2 mb-3">Room Assignment</h6>
<div class="row g-3 mb-4">
<div class="col-md-3"><label class="form-label fw-semibold">Ward</label><input type="text" name="ward" class="form-control" placeholder="e.g. Ward A"></div>
<div class="col-md-3"><label class="form-label fw-semibold">Room Number *</label><input type="text" name="room_number" class="form-control" required></div>
<div class="col-md-3"><label class="form-label fw-semibold">Bed Number</label><input type="text" name="bed_number" class="form-control"></div>
<div class="col-md-3"><label class="form-label fw-semibold">Room Type</label>
<select name="room_type" class="form-select">
{% for val, label in room_types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
</select></div>
<div class="col-md-4"><label class="form-label fw-semibold">Expected Discharge</label><input type="date" name="expected_discharge" class="form-control"></div>
</div>
<div class="mb-3"><label class="form-label fw-semibold">Admission Diagnosis *</label><textarea name="admission_diagnosis" class="form-control" rows="3" required></textarea></div>
<div class="mb-3"><label class="form-label fw-semibold">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary px-4"><i class="fas fa-user-check me-1"></i>Admit Patient</button>
<a href="{% url 'ipd_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</form>
</div>
</div>
{% endblock %}
