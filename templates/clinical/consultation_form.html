{% extends 'base.html' %}
{% block title %}New Consultation{% endblock %}
{% block page_title %}New Consultation Request{% endblock %}
{% block content %}
<div class="row"><div class="col-md-7">
<div class="card">
<div class="card-header py-3 px-4"><i class="fas fa-comments-medical me-2 text-primary"></i>Consultation Request</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="row g-3">
<div class="col-md-6"><label class="form-label fw-semibold">Patient *</label>
<select name="patient" class="form-select" required>
<option value="">-- Select --</option>
{% for p in patients %}<option value="{{ p.pk }}" {% if patient and patient.pk == p.pk %}selected{% endif %}>{{ p.get_full_name }}</option>{% endfor %}
</select></div>
{% if admissions %}<div class="col-md-6"><label class="form-label fw-semibold">Admission</label>
<select name="admission" class="form-select">
<option value="">-- Optional --</option>
{% for adm in admissions %}<option value="{{ adm.pk }}">{{ adm.admission_number }}</option>{% endfor %}
</select></div>{% endif %}
<div class="col-md-6"><label class="form-label fw-semibold">Requesting Doctor</label>
<select name="requesting_doctor" class="form-select">
<option value="">-- Optional --</option>
{% for d in doctors %}<option value="{{ d.pk }}">Dr. {{ d.user.get_full_name }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Consulting Doctor *</label>
<select name="consulting_doctor" class="form-select" required>
<option value="">-- Select --</option>
{% for d in doctors %}<option value="{{ d.pk }}">Dr. {{ d.user.get_full_name }} – {{ d.specialization }}</option>{% endfor %}
</select></div>
<div class="col-md-4"><label class="form-label fw-semibold">Priority</label>
<select name="priority" class="form-select">
{% for val, label in priority_choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
</select></div>
<div class="col-12"><label class="form-label fw-semibold">Reason / Question *</label><textarea name="reason" class="form-control" rows="3" required></textarea></div>
<div class="col-12"><label class="form-label fw-semibold">Clinical Summary</label><textarea name="clinical_summary" class="form-control" rows="4" placeholder="Brief summary of the case, relevant history, investigations..."></textarea></div>
<div class="col-12">
<button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i>Send Request</button>
<a href="{% url 'consultation_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</div>
</div>
</form>
</div>
</div>
</div></div>
{% endblock %}
