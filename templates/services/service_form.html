{% extends 'base.html' %}
{% block title %}{{ action }} Service{% endblock %}
{% block page_title %}{{ action }} Service{% endblock %}
{% block content %}
<div class="row"><div class="col-md-7">
<div class="card">
<div class="card-header py-3 px-4">{{ action }} Service</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="row g-3">
<div class="col-md-8"><label class="form-label fw-semibold">Name *</label><input type="text" name="name" class="form-control" value="{{ service.name }}" required></div>
<div class="col-md-4"><label class="form-label fw-semibold">Code *</label><input type="text" name="code" class="form-control" value="{{ service.code }}" required></div>
<div class="col-md-6"><label class="form-label fw-semibold">Category</label>
<select name="category" class="form-select">
<option value="">-- None --</option>
{% for cat in categories %}<option value="{{ cat.pk }}" {% if service.category.pk == cat.pk %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Type</label>
<select name="service_type" class="form-select">
{% for val, label in type_choices %}<option value="{{ val }}" {% if service.service_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Department</label>
<select name="department" class="form-select">
<option value="">-- None --</option>
{% for dept in departments %}<option value="{{ dept.pk }}" {% if service.department.pk == dept.pk %}selected{% endif %}>{{ dept.name }}</option>{% endfor %}
</select></div>
<div class="col-md-3"><label class="form-label fw-semibold">Price</label><input type="number" name="price" class="form-control" step="0.01" value="{{ service.price|default:0 }}"></div>
<div class="col-md-3"><label class="form-label fw-semibold">Duration (min)</label><input type="number" name="duration_minutes" class="form-control" value="{{ service.duration_minutes|default:30 }}"></div>
<div class="col-12"><label class="form-label fw-semibold">Description</label><textarea name="description" class="form-control" rows="2">{{ service.description }}</textarea></div>
<div class="col-12"><div class="form-check"><input type="checkbox" name="requires_doctor" class="form-check-input" id="req_doc" {% if service.requires_doctor or action == 'Create' %}checked{% endif %}><label class="form-check-label fw-semibold" for="req_doc">Requires Doctor</label></div></div>
{% if action == 'Edit' %}<div class="col-12"><div class="form-check"><input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if service.is_active %}checked{% endif %}><label class="form-check-label fw-semibold" for="is_active">Active</label></div></div>{% endif %}
<div class="col-12">
<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save</button>
<a href="{% url 'service_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</div>
</div>
</form>
</div>
</div>
</div></div>
{% endblock %}
