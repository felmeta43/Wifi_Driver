{% extends 'base.html' %}
{% block title %}{{ action }} Department{% endblock %}
{% block page_title %}{{ action }} Department{% endblock %}
{% block content %}
<div class="row"><div class="col-md-6">
<div class="card"><div class="card-header py-3 px-4">{{ action }} Department</div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label fw-semibold">Name *</label>
<input type="text" name="name" class="form-control" value="{{ dept.name }}" required></div>
<div class="mb-3"><label class="form-label fw-semibold">Icon (FontAwesome class)</label>
<input type="text" name="icon" class="form-control" value="{{ dept.icon|default:'fa-hospital' }}" placeholder="e.g. fa-heart"></div>
<div class="mb-3"><label class="form-label fw-semibold">Description</label>
<textarea name="description" class="form-control" rows="3">{{ dept.description }}</textarea></div>
<button type="submit" class="btn btn-primary">Save</button>
<a href="{% url 'departments' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</form>
</div></div>
</div></div>
{% endblock %}
